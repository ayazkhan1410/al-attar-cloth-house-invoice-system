{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4">✏️ Edit Customer</h2>
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required value="{{ customer.name }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone Number</label>
        <input type="text" name="phone" class="form-control" required value="{{ customer.phone_number }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Secondary Phone</label>
        <input type="text" name="phone2" class="form-control" value="{{ customer.phone_number2 }}">
      </div>
      <div class="col-md-12">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" value="{{ customer.address }}">
      </div>
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">💾 Update</button>
      <a href="{% url 'customer_list' %}" class="btn btn-secondary">↩️ Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
