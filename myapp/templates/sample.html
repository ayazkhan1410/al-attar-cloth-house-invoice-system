<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Invoice</title>

  <!-- Bootstrap 5 CDN (optional for print but useful for clean styling) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @media print {
      .no-print { display: none; }
      body {
        margin: 0;
        padding: 0;
      }
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      padding: 40px;
    }

    .delivery-slip {
      max-width: 600px;
      margin: auto;
      border: 1px solid #dee2e6;
      padding: 30px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    .delivery-slip h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .detail-label {
      font-weight: bold;
      margin-top: 10px;
    }

    .cod-amount {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="delivery-slip">
    <h2>Delivery Slip</h2>
    <p class="detail-label">Name:</p>
    <p>{{ invoice.customer.name }}</p>

    <p class="detail-label">Phone:</p>
    <p>{{ invoice.customer.phone_number }}</p>

    <p class="detail-label">Address:</p>
    <p>{{ invoice.customer.address }}</p>

    <hr>
    <p class="cod-amount">COD Amount: Rs {{  invoice_total_amount }}</p>

    <div class="text-center mt-4 no-print">
      <button class="btn btn-primary" onclick="window.print()">Print</button>
    </div>
  </div>
</body>
</html>
