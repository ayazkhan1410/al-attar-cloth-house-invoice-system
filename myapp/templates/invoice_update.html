{% extends 'base.html' %}
{% block content %}
<div class="container my-4">
  <h2 class="fw-bold text-primary mb-4">✏️ Update Invoice #{{ invoice.invoice_number }}</h2>

  <form method="post">
    {% csrf_token %}

    <!-- Advance & Delivery Fields -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="advance_payment" class="form-label">💰 Advance Payment</label>
        <input type="number" name="advance_payment" id="advance_payment" class="form-control" value="{{ invoice.advance_payment }}">
      </div>
      <div class="col-md-6">
        <label for="delivery_charge" class="form-label">🚚 Delivery Charges</label>
        <input type="number" name="delivery_charge" id="delivery_charge" class="form-control" value="{{ invoice.delivery_charge }}">
      </div>
    </div>

    <!-- Item Fields -->
    <h4 class="mt-4">📦 Invoice Items</h4>
    <div id="item-container">
      {% for item in items %}
        <div class="row g-2 mb-2 item-row">
          <div class="col-md-5">
            <label class="form-label">🛍️ Product Name</label>
            <input name="product_name[]" value="{{ item.product_name }}" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">🔢 Quantity</label>
            <input type="number" name="quantity[]" value="{{ item.quantity }}" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">💵 Price</label>
            <input type="number" step="0.01" name="price[]" value="{{ item.price }}" class="form-control" required>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-danger remove-item w-100">🗑️ Remove</button>
          </div>
        </div>
      {% endfor %}
    </div>

    <button type="button" class="btn btn-secondary my-3" id="add-item">➕ Add Item</button>
    <br>
    <button type="submit" class="btn btn-primary">💾 Save Changes</button>
    <a href="{% url 'one_invoice' invoice.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>

<script>
  document.getElementById('add-item').addEventListener('click', function () {
    const container = document.getElementById('item-container');
    const row = document.createElement('div');
    row.className = 'row g-2 mb-2 item-row';
    row.innerHTML = `
      <div class="col-md-5">
        <label class="form-label">🛍️ Product Name</label>
        <input name="product_name[]" class="form-control" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">🔢 Quantity</label>
        <input type="number" name="quantity[]" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">💵 Price</label>
        <input type="number" step="0.01" name="price[]" class="form-control" required>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="button" class="btn btn-danger remove-item w-100">🗑️ Remove</button>
      </div>
    `;
    container.appendChild(row);
  });

  document.addEventListener('click', function (e) {
    if (e.target.classList.contains('remove-item')) {
      e.target.closest('.item-row').remove();
    }
  });
</script>
{% endblock %}
